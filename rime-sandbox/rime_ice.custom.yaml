# 雾凇拼音个人扩展（沙箱测试版）
# 全部改动通过 patch 注入，不改动 rime_ice.schema.yaml 本体。
patch:
  # 1) 处理器：菜单按键拦截必须排在 speller 之前
  engine/processors:
    - lua_processor@*menu_processor
    - lua_processor@*select_character
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor

  # 2) 翻译器：菜单 / 剪贴板 / 收藏
  engine/translators/+:
    - lua_translator@*lua_menu
    - lua_translator@*clipboard
    - lua_translator@*favorite

  # 3) 滤镜：fuzzy_filter 必须排最前（要在 corrector 读取 ［拼音］ 注释之前拿到拼音）；
  #         输入为 v 时压制普通中英文候选仍排最后
  engine/filters:
    - lua_filter@*fuzzy_filter
    - lua_filter@*corrector
    - reverse_lookup_filter@radical_reverse_lookup
    - lua_filter@*autocap_filter
    - lua_filter@*v_filter
    - lua_filter@*pin_cand_filter
    - lua_filter@*long_word_filter
    - lua_filter@*reduce_english_filter
    - simplifier@emoji
    - simplifier@traditionalize
    - lua_filter@*search@radical_pinyin
    - uniquifier
    - lua_filter@*menu_filter

  # 4) 识别器：让 v / v2 / v3 成为独立输入段
  recognizer/patterns/vmenu: "^v$"
  recognizer/patterns/clipboard: "^v2$"
  recognizer/patterns/favorite: "^v3.*$"

  # 5) 让出 v2 / v3 这两个符号编码给剪贴板与收藏
  punctuator/symbols/v2: []
  punctuator/symbols/v3: []
